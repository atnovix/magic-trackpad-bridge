; Magic Trackpad 1 -> ESP32 (TTGO, ESP32-D0WDQ6) Bluetooth-HID-host bridge
; Bouwen:  pio run            Flashen: pio run -t upload     Monitor: pio device monitor
[env:ttgo-esp32]
platform = espressif32
board = esp32dev
framework = espidf
board_build.flash_size = 4MB
upload_port = COM3
upload_speed = 921600
monitor_port = COM3
monitor_speed = 921600
monitor_filters = direct
